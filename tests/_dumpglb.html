<script>
/* 用真实的 Forgeworks 管线导出一个 GLB，输出 base64 供外部抓取。
   目的是验证「工具产出的 GLB → Blender 能否正确读取」这条链路。 */
(function(){
  var ID = location.hash.replace('#','') || 'MC_DRILL';
  function finish(txt){
    document.getElementById('r').textContent = 'DUMP_START\n' + txt + '\nDUMP_END';
    document.title = 'DUMP_DONE';
  }
  try{
    var m = machineOf(ID);
    if(!m){ finish('ERR: no machine ' + ID); return; }

    var cv = document.createElement('canvas');
    cv.width = 512; cv.height = 512;
    document.body.appendChild(cv);

    var V = createViewer3D(cv, m);
    V.toGLB(function(result, err, meta){
      if(err){ finish('ERR glb: ' + err.message); return; }
      try{
        var blob = (result instanceof Blob) ? result : new Blob([result]);
        var fr = new FileReader();
        fr.onload = function(){
          var b64 = String(fr.result).split(',')[1] || '';
          finish('ID=' + ID + '\nSIZE=' + blob.size
               + '\nMETA=' + JSON.stringify(meta || {})
               + '\nB64=' + b64);
        };
        fr.readAsDataURL(blob);
      }catch(e){ finish('ERR read: ' + e.message); }
    });
  }catch(e){
    finish('ERR init: ' + e.message + '\n' + (e.stack||''));
  }
})();
</script>
</body>
</html>
