<pre id="selftest-result" style="font:12px monospace;white-space:pre-wrap;padding:16px"></pre>
<script>
(function(){
  var errs = [];
  window.addEventListener('error', function(e){ errs.push(String(e.message)); });

  var out = { errors: errs, checks: [], summary: {} };
  function check(name, fn){
    try{
      var r = fn();
      out.checks.push({ name: name, ok: !!r, detail: (typeof r === 'string') ? r : '' });
    }catch(e){
      out.checks.push({ name: name, ok: false, detail: 'EXCEPTION: ' + e.message });
    }
  }
  function finish(){
    out.errors = errs.slice();
    out.summary = {
      total: out.checks.length,
      pass: out.checks.filter(function(c){ return c.ok; }).length,
      fail: out.checks.filter(function(c){ return !c.ok; }).length,
      runtimeErrors: errs.length
    };
    document.getElementById('selftest-result').textContent =
      'SELFTEST_JSON_START\n' + JSON.stringify(out, null, 2) + '\nSELFTEST_JSON_END';
    document.title = (out.summary.fail === 0 && errs.length === 0) ? 'SELFTEST_PASS' : 'SELFTEST_FAIL';
  }

  function runSync(){
    check('数据已载入', function(){ return S && S.items.length > 0 ? S.items.length + ' 物品' : false; });
    check('VIEWS 已构建', function(){ return VIEWS && Object.keys(VIEWS).length > 0 ? Object.keys(VIEWS).length + ' 个视图' : false; });

    Object.keys(VIEWS).forEach(function(v){
      check('视图 ' + v, function(){
        cur = v; VIEWS[v].render();
        var len = document.getElementById('view').innerHTML.length;
        return len > 100 ? len + ' 字符' : '内容过短 ' + len;
      });
    });

    check('建筑描述词全覆盖', function(){
      var bad = S.machines.filter(function(m){
        try { var p = machinePrompt(m, {withTech:true}); return !p || p.length < 80; } catch(e){ return true; }
      });
      return bad.length === 0 ? S.machines.length + ' 条' : '缺失 ' + bad.length;
    });
    check('物品描述词全覆盖', function(){
      var bad = S.items.filter(function(it){
        try { return !itemPrompt(it, {withTech:true}); } catch(e){ return true; }
      });
      return bad.length === 0 ? S.items.length + ' 条' : '缺失 ' + bad.length;
    });
    check('等轴测预览', function(){
      var bad = S.machines.filter(function(m){
        try { var s = isoPreview(m, 0, 132); return !s || s.indexOf('<svg') !== 0; } catch(e){ return true; }
      });
      return bad.length === 0 ? S.machines.length + ' 个' : '失败 ' + bad.length;
    });

    /* ============================================================
       风格引擎 —— 重点是验证「跨模块联动」真的接上了
       ============================================================ */
    check('风格基线可解析', function(){
      var st = getStyle();
      return (st && st.palette && st.palette.structure && st.id === STYLE_PRESET.id)
        ? st.name + ' / ' + Object.keys(st.palette.accent).length + ' 个强调色'
        : false;
    });

    check('色板全部落在角色带内（统一性算法）', function(){
      var bad = [];
      var roles = ['structure','metal','metalDark','metalLite','glass','glow','hazard'];
      var st = getStyle();
      roles.forEach(function(role){
        var b = toneBand(role, st);
        var f = fitColor(st.palette[role], role, st);
        if(f.satAfter < b.sat[0]-0.6 || f.satAfter > b.sat[1]+0.6)
          bad.push(role+' S='+f.satAfter.toFixed(1));
        if(f.ligAfter < b.lig[0]-0.6 || f.ligAfter > b.lig[1]+0.6)
          bad.push(role+' L='+f.ligAfter.toFixed(1));
      });
      return bad.length === 0
        ? roles.length + ' 角色全部合规'
        : '违规：' + bad.slice(0, 3).join(' | ');
    });

    check('旋钮能把颜色推出带外再拉回', function(){
      // 饱和度拉到 -40，structure 应该比默认更灰
      var before = getStyle().palette.structure;
      var sBefore = hexToHsl(before).s;
      try{
        setKnob('satBoost', -40);
        var after = getStyle().palette.structure;
        var sAfter = hexToHsl(after).s;
        return sAfter < sBefore ? 'S ' + sBefore.toFixed(1) + '% → ' + sAfter.toFixed(1) + '%' : '旋钮无效';
      }finally{ resetKnobs(); }
    });

    check('旋钮 → 描述词跟着变', function(){
      var m = S.machines[0], a, b;
      try{
        setKnob('detail', 0);
        a = machinePrompt(m, {withTech:true});
        setKnob('detail', 1);
        b = machinePrompt(m, {withTech:true});
      }finally{ resetKnobs(); }
      return a !== b ? '描述词随旋钮改写' : '描述词没变（旋钮没接上）';
    });

    check('旋钮 → 图标跟着变', function(){
      var it = S.items[0], a, b;
      clearIconCache();
      try{
        setKnob('satBoost', -40);
        a = iconURL(it);
        setKnob('satBoost', 40);
        b = iconURL(it);
      }finally{ resetKnobs(); clearIconCache(); }
      return a !== b ? '图标配色随旋钮变' : '图标没变';
    });

    check('图标采用风格校正色（不是原始 item.color）', function(){
      var st = getStyle();
      var target = null;
      S.items.forEach(function(it){
        if(target) return;
        var f = itemFitColor(it, st);
        if(f.changed && Math.abs(f.satDelta) + Math.abs(f.ligDelta) > 8) target = it;
      });
      if(!target) return '所有物品色本就在带内，无需验证';
      var svg = iconInner(target);
      var orig = String(target.color).toLowerCase();
      return svg.indexOf(orig) < 0
        ? '原色 ' + orig + ' 已被替换为 ' + itemFitColor(target, st).hex
        : '仍在用原色 ' + orig;
    });

    check('材质方案可切换（仅渲染）', function(){
      var m = S.machines[0];
      var a = buildMachineParts(m, 'industrial').parts[0].mat.color;
      var b = buildMachineParts(m, 'rusted').parts[0].mat.color;
      return a !== b ? a + ' → ' + b : '材质没变';
    });

    check('3D 强调色跟随风格旋钮', function(){
      var m = S.machines[0], a, b;
      try{
        setKnob('satBoost', -30);
        a = buildMachineParts(m).accent;
        setKnob('satBoost', 30);
        b = buildMachineParts(m).accent;
      }finally{ resetKnobs(); }
      return a !== b ? a + ' → ' + b : '强调色没变';
    });

    check('一致性检查可运行', function(){
      var r = styleCheck();
      if(typeof r.total !== 'number') return false;
      var kd = Object.keys(r.byKind).map(function(k){
        return k + ' ' + r.byKind[k].total + '(严重' + r.byKind[k].high + ')';
      }).join(' / ');
      return r.total + ' 处：' + kd;
    });

    check('风格可序列化', function(){
      var j = JSON.stringify(styleToJson());
      return j.length > 200 ? Math.round(j.length / 102.4) / 10 + ' KB' : '过短 ' + j.length;
    });

    check('配色修正表可生成且修正后合规', function(){
      var t = stylePaletteFixTable();
      var n = Object.keys(t).length;
      if(!n) return '当前风格下无需修正';
      // 修正后的每个色，按其被分配的**实际角色**检查是否落在对应带内
      var st = getStyle(), bad = 0, checked = 0;
      Object.keys(t).forEach(function(id){
        var hx = String(t[id].after).match(/#[0-9a-fA-F]{6}/g) || [];
        var roles = assignPaletteRoles(hx);   // 对修正后的色重新推角色
        hx.forEach(function(h, i){
          checked++;
          var f = fitColor(h, roles[i], st);
          if(Math.abs(f.satDelta) > 0.6 || Math.abs(f.ligDelta) > 0.6) bad++;
        });
      });
      return bad === 0 ? n + ' 个建筑 / ' + checked + ' 个色，全部合规'
                       : n + ' 个建筑，' + bad + '/' + checked + ' 个色仍不合规';
    });

    check('配色角色推断正确（按饱和度定强调色）', function(){
      // 强调色在前 / 在后两种情况都要能认出来
      var r1 = assignPaletteRoles(['#8b6b4a', '#3d3d3b']);   // 锈红在前
      var r2 = assignPaletteRoles(['#6b6e73', '#e07b39']);   // 炉火橙在后
      var r3 = assignPaletteRoles(['#e8eaec']);              // 单色低饱和
      var ok = r1[0] === 'accent' && r2[1] === 'accent' && r3[0] === 'structure';
      return ok ? '前/后/单色 三种情况均正确'
                : '推断错误 r1=' + r1.join(',') + ' r2=' + r2.join(',') + ' r3=' + r3.join(',');
    });

    check('修正代码片段可生成', function(){
      var s = styleFixSnippet();
      return s.length > 40 ? s.split('\n').length + ' 行' : '片段过短';
    });

    // ---- three.js ----
    check('three.js 已加载', function(){ return haveThree() ? 'REVISION ' + THREE.REVISION : '未加载'; });
    check('OrbitControls 已加载', function(){ return !!THREE.OrbitControls; });
    check('GLTFExporter 已加载', function(){ return !!THREE.GLTFExporter; });

    check('3D 体块构建', function(){
      var bad = S.machines.filter(function(m){
        try {
          var g = buildMachineParts(m);
          return !g || !g.parts || g.parts.length < 3 || !(g.H > 0);
        } catch(e){ return true; }
      });
      return bad.length === 0 ? S.machines.length + ' 个建筑' : '失败 ' + bad.length;
    });

    check('几何体类型多样（不能全是方块）', function(){
      var kindsAll = {};
      S.machines.forEach(function(m){
        buildMachineParts(m).parts.forEach(function(p){
          var k = p.kind || 'box';
          kindsAll[k] = (kindsAll[k] || 0) + 1;
        });
      });
      var names = Object.keys(kindsAll);
      var nonBox = names.filter(function(k){ return k !== 'box'; });
      if(nonBox.length < 5) return '非方块图元只有 ' + nonBox.length + ' 种: ' + nonBox.join(',');
      // 每个建筑至少要有 1/3 是非方块部件
      var bad = S.machines.filter(function(m){
        var ps = buildMachineParts(m).parts;
        var nb = ps.filter(function(p){ return (p.kind||'box') !== 'box'; }).length;
        return nb / ps.length < 0.34;
      });
      if(bad.length) return bad.length + ' 个建筑方块占比过高';
      return names.length + ' 种图元 / ' + (kindsAll.cyl||0) + ' 圆柱 (非方块占比达标)';
    });

    check('动画描述符合法', function(){
      var kinds = {spin:1, bob:1, slide:1, swing:1, pulse:1};
      var bad = 0, animCount = 0;
      S.machines.forEach(function(m){
        buildMachineParts(m).parts.forEach(function(p){
          if(!p.anim) return;
          animCount++;
          if(!kinds[p.anim.kind]) bad++;
        });
      });
      return bad === 0 ? animCount + ' 个动画部件' : bad + ' 个非法动画';
    });

    check('建筑带粒子配置', function(){
      var withP = S.machines.filter(function(m){ return !!buildMachineParts(m).particles; });
      return withP.length > 0 ? withP.length + '/' + S.machines.length + ' 个建筑有粒子' : '无粒子配置';
    });

    /* ---- 资产图层：白模 / 材质 / UV / LOD / 碰撞 / 动画 / 元数据 ---- */
    check('图层状态归一化', function(){
      var layers = fwLayersOf({ui3d:{layers:{lod:9, collisionHeight:-2}}});
      if(layers.lod !== 2) return 'lod 未夹取: ' + layers.lod;
      if(layers.collisionHeight !== null) return '负碰撞高未回落';
      var missing = Object.keys(FW_LAYER_DEFAULTS).filter(function(key){ return !(key in layers); });
      return missing.length ? '缺字段 ' + missing.join(',') : Object.keys(layers).length + ' 项';
    });

    check('图层可写回并派生碰撞盒', function(){
      var holder = {ui3d:{layers:{}}};
      var out = fwSetLayer(holder, 'clay', true);
      if(!out.clay) return '白模未写入';
      var box = fwCollisionBox(S.machines[0]);
      if(!(box.w > 0 && box.d > 0 && box.h > 0)) return '碰撞盒尺寸无效';
      return '碰撞 ' + box.w + '×' + box.h + '×' + box.d + ' m';
    });

    check('UV 棋盘纹理可用', function(){
      var a = fwUvCheckerTexture();
      var b = fwUvCheckerTexture();
      return a && a.isTexture && a === b ? '棋盘纹理缓存命中' : '纹理未缓存';
    });

    check('LOD 三档逐级减面', function(){
      var bad = 0;
      S.machines.forEach(function(m){
        var plan = fwLodPlan(m);
        if(!plan || plan.levels.length !== 3){ bad++; return; }
        if(plan.levels[0].triangles !== plan.totalTriangles) bad++;
        else if(plan.levels[1].triangles > plan.levels[0].triangles) bad++;
        else if(plan.levels[2].triangles > plan.levels[1].triangles) bad++;
      });
      return bad === 0 ? S.machines.length + ' 个建筑 LOD 单调递减' : bad + ' 个建筑 LOD 异常';
    });

    check('资产方面七项齐全', function(){
      var aspects = fwAssetAspects(S.machines[0]);
      if(!aspects) return '无输出';
      var need = ['geometry','material','uv','lod','collision','animation','metadata'];
      var missing = need.filter(function(key){ return !aspects[key]; });
      if(missing.length) return '缺 ' + missing.join(',');
      if(!(aspects.geometry.parts > 0 && aspects.geometry.triangles > 0)) return '几何为空';
      if(!aspects.uv.channels.length) return '无 UV 通道';
      return aspects.geometry.parts + ' 件 / ' + aspects.geometry.triangles + ' 面 / ' +
        aspects.material.slots + ' 材质槽';
    });

    check('流水线含全部资产阶段', function(){
      var graph = pipelineStarterGraph('probe', 'machine');
      var types = graph.nodes.map(function(node){ return node.type; });
      var need = ['styleApply','uv','lod','collision','animation','metadata','validate','export'];
      var missing = need.filter(function(type){ return types.indexOf(type) < 0; });
      if(missing.length) return '缺 ' + missing.join(',');
      var prevAsset = PIPELINE.assetId;
      PIPELINE.assetId = S.machines[0].id;
      var derived = pipelineDeriveStage({type:'lod'});
      PIPELINE.assetId = prevAsset;
      if(!derived.ok) return '本地推导失败: ' + derived.error;
      if(!derived.output.levels || derived.output.levels.length !== 3) return 'LOD 输出不完整';
      return types.length + ' 节点 / ' + PIPELINE_LOCAL_STAGES.length + ' 个本地阶段';
    });

    check('元素可进入生成管线', function(){
      var el = S.elements[0];
      var prev = PIPELINE.assetId;
      PIPELINE.assetId = el.id;
      var target = pipelineAssetTarget();
      PIPELINE.assetId = prev;
      if(!target || target.kind !== 'element') return '管线未识别元素';
      var prompt = elementPrompt(el, {withTech:true});
      if(!prompt || prompt.length < 60 || prompt.indexOf(el.name) < 0) return '元素描述词异常';
      var graph = pipelineStarterGraph(el.id, 'icon');
      var types = graph.nodes.map(function(node){ return node.type; });
      if(types.indexOf('imageExport') < 0) return '图标模板缺 imageExport';
      return target.kind + ' / ' + types.join('→');
    });

    check('管线下拉标记已存档', function(){
      var prevCur = cur, prevAsset = PIPELINE.assetId, prevGraph = PIPELINE.graph;
      var prevArchive = window.pipelineHasArchive;
      var machine = S.machines[0];
      PIPELINE.assetId = machine.id;
      PIPELINE.kind = 'machine';
      PIPELINE.graph = pipelineStarterGraph(machine.id, 'machine');
      window.pipelineHasArchive = function(id){ return id === machine.id; };
      try {
        cur = 'pipeline'; VIEWS.pipeline.render();
        var text = document.getElementById('pipelineAsset').innerText;
        if(text.indexOf('🟢') < 0) return '没有绿点';
        if(text.indexOf('已存档') < 0) return '没有已存档文字';
        return '🟢 + 已存档';
      } finally {
        window.pipelineHasArchive = prevArchive;
        PIPELINE.assetId = prevAsset;
        PIPELINE.graph = prevGraph;
        cur = prevCur;
      }
    });

    check('管线节点显示生成图与模型预览', function(){
      if(typeof THREE === 'undefined' || !THREE.GLTFLoader) return 'GLTFLoader 未加载';

  function runAsync(done){
    // GLB 导出是异步的，单独测
    var cv = document.createElement('canvas');
    cv.width = 200; cv.height = 160;
    cv.getBoundingClientRect = function(){ return {width:200, height:160}; };
    document.body.appendChild(cv);
    var v = null, settled = false;
    function report(ok, detail){
      if(settled) return;
      settled = true;
      out.checks.push({ name: 'GLB 可被 UE 导入', ok: ok, detail: detail });
      try{ if(v) v.dispose(); }catch(e){}
      cv.remove();
      done();
    }
    try{
      v = createViewer3D(cv, S.machines[0]);
      v._advance(0.2);
      v.toGLB(function(buf, err, meta){
        if(err) return report(false, 'ERROR: ' + err.message);
        if(!buf) return report(false, '返回空');
        // 解析 GLB 容器，验证是否 UE 可直接导入
        var bytes = (buf.byteLength !== undefined) ? buf.byteLength : buf.length;
        var dv = new DataView(buf);
        var magic = String.fromCharCode(dv.getUint8(0), dv.getUint8(1), dv.getUint8(2), dv.getUint8(3));
        if(magic !== 'glTF') return report(false, '不是 GLB（magic=' + magic + '）');
        var ver = dv.getUint32(4, true);
        if(ver !== 2) return report(false, 'glTF 版本不是 2: ' + ver);
        var jsonLen = dv.getUint32(12, true);
        var jsonStr = new TextDecoder('utf-8').decode(new Uint8Array(buf, 20, jsonLen));
        var j = JSON.parse(jsonStr);

        var problems = [];
        // 1) 必须是单网格（多网格会在 UE 里变成一堆独立资产）
        if(!j.meshes || j.meshes.length !== 1) problems.push('网格数=' + (j.meshes||[]).length + '（应为 1）');
        // 2) primitive 数应等于材质数（一材质一槽）
        var prims = j.meshes[0].primitives.length;
        var mats = (j.materials||[]).length;
        if(prims !== mats) problems.push('primitive(' + prims + ') ≠ 材质(' + mats + ')');
        // 3) 材质要有名字，方便 UE 里识别
        (j.materials||[]).forEach(function(mm, i){
          if(!mm.name || mm.name.indexOf('M_') !== 0) problems.push('材质 ' + i + ' 缺名字');
        });
        // 4) 节点要带机器 ID
        var nm = j.nodes && j.nodes[0] && j.nodes[0].name;
        if(!nm) problems.push('节点无名字');
        // 5) extras 要带资产方面，UE 侧才能读到 UV/LOD/碰撞/图层
        var fwExtra = j.nodes && j.nodes[0] && j.nodes[0].extras && j.nodes[0].extras.forgeworks;
        if(!fwExtra) problems.push('缺 forgeworks extras');
        else ['uv','lod','collision','layers'].forEach(function(key){
          if(!fwExtra[key]) problems.push('extras 缺 ' + key);
        });
        // 5) 包围盒：底部贴地 + 不超出占地
        var mn = [Infinity,Infinity,Infinity], mx = [-Infinity,-Infinity,-Infinity];
        j.meshes[0].primitives.forEach(function(p){
          var a = j.accessors[p.attributes.POSITION];
          for(var k=0;k<3;k++){ mn[k]=Math.min(mn[k],a.min[k]); mx[k]=Math.max(mx[k],a.max[k]); }
        });
        if(Math.abs(mn[1]) > 0.02) problems.push('未贴地: minY=' + mn[1].toFixed(3));
        var fp = parseFootprint(S.machines[0].footprint);
        if(mx[0]-mn[0] > fp[0] + 0.02) problems.push('X 超出占地: ' + (mx[0]-mn[0]).toFixed(2) + ' > ' + fp[0]);
        if(mx[2]-mn[2] > fp[1] + 0.02) problems.push('Z 超出占地: ' + (mx[2]-mn[2]).toFixed(2) + ' > ' + fp[1]);

        if(problems.length) return report(false, problems.join('; '));
        report(true, bytes + ' 字节 / 1 网格 / ' + mats + ' 材质槽 / ' +
               (mx[0]-mn[0]).toFixed(2) + '×' + (mx[2]-mn[2]).toFixed(2) + 'm');
      });
      setTimeout(function(){ report(false, '超时（5s）'); }, 5000);
    }catch(e){
      report(false, 'EXCEPTION: ' + e.message);
    }
  }

  window.addEventListener('load', function(){
    setTimeout(function(){
      var initialView = cur;
      runSync();
      runAsync(function(){
        setTimeout(function(){
          // 测试会逐个渲染所有视图，结束后恢复原视图，避免侧栏与内容对不上
          if(initialView && VIEWS[initialView]){ cur = initialView; render(); }
          finish();
        }, 60);
      });
    }, 250);
  });
})();
</script>
