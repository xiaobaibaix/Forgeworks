<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgeworks · 工厂游戏内容设计器</title>
<link rel="stylesheet" href="../css/theme.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/components.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <h1>Forgeworks</h1>
      <p id="statLine">载入中…</p>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <button id="btnSave" class="sm">保存到本地</button>
      <button id="btnReset" class="sm">恢复预填数据</button>
    </div>
  </aside>
  <main class="main">
    <div class="head">
      <h2 id="viewTitle">元素</h2>
      <span class="sub" id="viewSub"></span>
      <div class="head-actions" id="headActions"></div>
    </div>
    <div class="body" id="view"></div>
  </main>
</div>

<div class="mask hide" id="mask"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<!-- ============================================================
     脚本按依赖顺序加载（顺序错了会 ReferenceError）。
     全部是普通 script（不是 ES module）——
     ES module 在 file:// 下会被 CORS 拦截，双击打不开。
     ============================================================ -->

<!-- 1. 配置与数据（先有 SEED，state.js 才能初始化 S） -->
<script src="../js/core/config.js"></script>
<script src="../js/data/seed.js"></script>
<script src="../js/data/prompts.js"></script>

<!-- 2. 状态与索引 -->
<script src="../js/core/state.js"></script>
<script src="../js/core/lookup.js"></script>

<!-- 3. 引擎（无 UI 依赖） -->
<script src="../js/engines/icons.js"></script>
<script src="../js/engines/viewer3d.js"></script>
<script src="../js/engines/validate.js"></script>
<script src="../js/engines/solver.js"></script>
<script src="../js/engines/balance.js"></script>
<script src="../js/engines/csv.js"></script>
<script src="../js/core/io.js"></script>

<!-- 4. UI 基础 -->
<script src="../js/ui/table.js"></script>
<script src="../js/ui/router.js"></script>
<script src="../js/ui/editor.js"></script>

<!-- 5. 各视图 -->
<script src="../js/views/elements.js"></script>
<script src="../js/views/items.js"></script>
<script src="../js/views/machines.js"></script>
<script src="../js/views/recipes.js"></script>
<script src="../js/views/techs.js"></script>
<script src="../js/views/eras.js"></script>
<script src="../js/views/assets.js"></script>
<script src="../js/views/prompts.js"></script>
<script src="../js/views/validate.js"></script>
<script src="../js/views/balance.js"></script>
<script src="../js/views/solve.js"></script>
<script src="../js/views/graph.js"></script>
<script src="../js/views/export.js"></script>

<!-- 6. 启动（构建 VIEWS 并首次渲染） -->
<script src="../js/main.js"></script>

<pre id="selftest-result" style="font:12px monospace;white-space:pre-wrap;padding:16px"></pre>
<script>
(function(){
  var errs = [];
  window.addEventListener('error', function(e){ errs.push(String(e.message)); });

  function run(){
    var out = { errors: errs.slice(), checks: [], summary: {} };
    function check(name, fn){
      try{
        var r = fn();
        out.checks.push({ name: name, ok: !!r, detail: (typeof r === 'string') ? r : '' });
      }catch(e){
        out.checks.push({ name: name, ok: false, detail: 'EXCEPTION: ' + e.message });
      }
    }

    check('数据已载入', function(){ return S && S.items.length > 0 ? S.items.length + ' 物品' : false; });
    check('VIEWS 已构建', function(){ return VIEWS && Object.keys(VIEWS).length > 0 ? Object.keys(VIEWS).length + ' 个视图' : false; });

    var views = Object.keys(VIEWS);
    views.forEach(function(v){
      check('视图 ' + v, function(){
        cur = v; VIEWS[v].render();
        var len = document.getElementById('view').innerHTML.length;
        return len > 100 ? len + ' 字符' : '内容过短 ' + len;
      });
    });

    check('建筑描述词全覆盖', function(){
      var missing = S.machines.filter(function(m){
        try { var p = machinePrompt(m, {withTech:true}); return !p || p.length < 80; }
        catch(e){ return true; }
      });
      return missing.length === 0 ? S.machines.length + ' 条' : '缺失 ' + missing.length;
    });
    check('物品描述词全覆盖', function(){
      var missing = S.items.filter(function(it){
        try { return !itemPrompt(it, {withTech:true}); } catch(e){ return true; }
      });
      return missing.length === 0 ? S.items.length + ' 条' : '缺失 ' + missing.length;
    });
    check('等轴测预览', function(){
      var bad = S.machines.filter(function(m){
        try { var s = isoPreview(m, 0, 132); return !s || s.indexOf('<svg') !== 0; }
        catch(e){ return true; }
      });
      return bad.length === 0 ? S.machines.length + ' 个' : '失败 ' + bad.length;
    });

    // ---- 3D 体块 ----
    check('3D 体块构建', function(){
      var bad = S.machines.filter(function(m){
        try {
          var g = buildMachineParts(m);
          return !g || !g.parts || g.parts.length < 3 || !(g.H > 0);
        } catch(e){ return true; }
      });
      return bad.length === 0 ? S.machines.length + ' 个建筑' : '失败 ' + bad.length;
    });
    check('3D 面绕序（法线朝外）', function(){
      // 校验 6 个面的法线都应背离中心
      var p = { c:[0,0,0], s:[1,1,1], col:'#fff' };
      var v = boxVerts(p);
      var badCount = 0;
      BOX_FACES.forEach(function(idx, fi){
        var a=v[idx[0]], b=v[idx[1]], c=v[idx[2]];
        var ux=b[0]-a[0], uy=b[1]-a[1], uz=b[2]-a[2];
        var wx=c[0]-a[0], wy=c[1]-a[1], wz=c[2]-a[2];
        var n=[uy*wz-uz*wy, uz*wx-ux*wz, ux*wy-uy*wx];
        // 面中心
        var cen=[0,0,0];
        idx.forEach(function(i){ cen[0]+=v[i][0]/4; cen[1]+=v[i][1]/4; cen[2]+=v[i][2]/4; });
        var dot = n[0]*cen[0] + n[1]*cen[1] + n[2]*cen[2];
        if(dot <= 0) badCount++;    // 法线应朝外
      });
      return badCount === 0 ? '6/6 面朝外' : badCount + ' 个面法线朝内';
    });
    check('3D 渲染器可创建', function(){
      var cv = document.createElement('canvas');
      cv.width = 200; cv.height = 200;
      cv.getBoundingClientRect = function(){ return {width:200, height:200}; };
      var v = createViewer3D(cv, S.machines[0]);
      var png = v.toPNG();
      v.dispose();
      return png && png.indexOf('data:image/png') === 0 ? 'ok' : '导出失败';
    });

    check('图标生成', function(){
      var bad = S.items.filter(function(it){
        try { var u = iconURL(it); return !u || u.indexOf('data:') !== 0; } catch(e){ return true; }
      });
      return bad.length === 0 ? S.items.length + ' 个' : '失败 ' + bad.length;
    });
    check('物料平衡', function(){
      var u = expandAmount('MOD_AUTOMATION', 1);
      return Object.keys(u.raws).length > 0 ? Object.keys(u.raws).length + ' 种原料' : '无原料';
    });
    check('CSV 生成', function(){ return itemCsv().split('\n').length > 1 ? 'ok' : false; });
    check('Markdown 生成', function(){ return mdExport().length > 500 ? 'ok' : false; });

    out.summary = {
      total: out.checks.length,
      pass: out.checks.filter(function(c){ return c.ok; }).length,
      fail: out.checks.filter(function(c){ return !c.ok; }).length,
      runtimeErrors: errs.length
    };
    document.getElementById('selftest-result').textContent =
      'SELFTEST_JSON_START\n' + JSON.stringify(out, null, 2) + '\nSELFTEST_JSON_END';
    document.title = out.summary.fail === 0 && errs.length === 0 ? 'SELFTEST_PASS' : 'SELFTEST_FAIL';
  }

  window.addEventListener('load', function(){ setTimeout(run, 250); });
})();
</script>
</body>
</html>
