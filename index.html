<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgeworks · 工厂游戏内容设计器</title>
<link rel="stylesheet" href="css/theme.css?v=20261021a">
<link rel="stylesheet" href="css/layout.css?v=20261021a">
<link rel="stylesheet" href="css/components.css?v=20261021a">
<link rel="stylesheet" href="css/pipeline.css?v=20261021a">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M12 3l7.5 4.4v9.2L12 21l-7.5-4.4V7.4z"/><path d="M12 8v8M9 12h6"/></svg>
      </div>
      <div class="brand-text">
        <h1>Forgeworks</h1>
        <p class="tagline">工厂内容设计台</p>
      </div>
    </div>
    <div class="brand-stats" id="statLine">载入中…</div>
    <div id="projectChip"></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <button id="btnSave" class="sm">保存到本地</button>
      <button id="btnReset" class="sm">恢复预填数据</button>
      <div id="buildStamp"></div>
    </div>
  </aside>
  <main class="main">
    <div class="head">
      <div class="head-title">
        <div class="crumb" id="viewCrumb">内容定义</div>
        <div class="title-row"><h2 id="viewTitle">元素</h2><span class="sub" id="viewSub"></span></div>
      </div>
      <div class="head-actions" id="headActions"></div>
    </div>
    <div class="body" id="view"></div>
  </main>
</div>

<div class="mask hide" id="mask"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<!-- ============================================================
     脚本按依赖顺序加载（顺序错了会 ReferenceError）。
     全部是普通 script（不是 ES module）——
     ES module 在 file:// 下会被 CORS 拦截，双击打不开。
     ============================================================ -->

<!-- 1. 配置与数据（先有 SEED，state.js 才能初始化 S） -->
<script src="js/core/config.js?v=20261021a"></script>

</body>
</html>
